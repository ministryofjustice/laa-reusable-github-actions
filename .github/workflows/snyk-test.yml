name: Reusable Snyk Code and Dependency Test

on:
  workflow_call:
    inputs:
      snyk_args:
        description: "Additional arguments to pass to snyk test (e.g. --severity-threshold=high --all-projects)"
        required: false
        type: string
        default: "--severity-threshold=high"
      fail_on_issues:
        description: "Fail the workflow when snyk test reports findings matching the configured threshold"
        required: false
        type: boolean
        default: true
      upload_sarif:
        description: "Whether to upload SARIF results to GitHub Code Scanning"
        required: false
        type: boolean
        default: true
    secrets:
      snyk_token:
        description: "Snyk service account API token"
        required: true

jobs:
  snyk-test:
    name: Snyk code and dependency test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #--v7.0.1

      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      - name: Run Snyk to test for vulnerabilities
        id: snyk_test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        run: |
          snyk test ${{ inputs.snyk_args }} --sarif-file-output=snyk.sarif

      - name: Replace security-severity "null" for license-related findings
        if: ${{ hashFiles('snyk.sarif') != '' }}
        run: |
          sed -i 's/"security-severity": "null"/"security-severity": "0"/g' snyk.sarif

      - name: Replace security-severity "undefined" for license-related findings
        if: ${{ hashFiles('snyk.sarif') != '' }}
        run: |
          sed -i 's/"security-severity": "undefined"/"security-severity": "0"/g' snyk.sarif

      - name: Upload result to GitHub Code Scanning
        if: ${{ inputs.upload_sarif && hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd #--v4.37.7
        with:
          sarif_file: snyk.sarif

      - name: Fail when configured threshold is met
        if: ${{ inputs.fail_on_issues && steps.snyk_test.outcome == 'failure' }}
        run: |
          echo "Snyk reported issues at or above the configured threshold."
          exit 1