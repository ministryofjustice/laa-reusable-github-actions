name: CP - Build image, push to ECR, scan for vulns and deploy to Cloud Platform

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment Environment"
        required: false
        type: string
      dockerfile_path:
        description: "Path to build Dockerfile"
        required: false
        type: string
        default: Dockerfile #--Dockerfile in current working directory
      build_mode:
        description: "Image build mode: dockerfile or gradle-buildpacks"
        required: false
        type: string
        default: dockerfile
      java_version:
        description: "Java version used for gradle-buildpacks builds"
        required: false
        type: string
        default: '25'
      java_distribution:
        description: "Java distribution used for gradle-buildpacks builds"
        required: false
        type: string
        default: temurin
      jar_subproject:
        description: "Gradle subproject containing the bootBuildImage task"
        required: false
        type: string
        default: ''
      docker_build_args:
        description: "Additional arguments passed to Dockerfile builds"
        required: false
        type: string
        default: ''
      app_name:
        description: "App Name"
        required: true
        type: string
      image_tag:
        description: "Image Tag"
        required: false
        type: string
        default: ${{ github.sha }}
      additional_image_tags:
        description: "JSON array of additional tags to apply to the image, e.g. '[\"latest\",\"stable\"]'"
        required: false
        type: string
        default: "[]"
      dockerfile_requires_git:
        description: "Set to 'true' if the Dockerfile needs git access"
        required: false
        type: boolean
        default: false
      k8s_service_account:
        description: "Service Account for Kubernetes Authentication"
        required: false
        type: string
        default: cd-serviceaccount
      helm_release_name:
        description: "Release Name for helm install"
        required: true
        type: string
      helm_chart:
        description: "Helm chart to use for release"
        required: true
        type: string
        default: ./laa-generic-helm-chart
      helm_values_path:
        description: "Path to values for helm deployment"
        required: true
        type: string
      helm_additional_args:
        description: "Any additional helm arguments"
        required: false
        type: string

jobs:
  build_and_push:
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-build-push.yml@5abe13ef5cc59e8dc2e71f70a6c28cd7a836a97d # feat/java-pipeline-refactor 2026-07-13
    with:
      environment: ${{ inputs.environment }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      build_mode: ${{ inputs.build_mode }}
      java_version: ${{ inputs.java_version }}
      java_distribution: ${{ inputs.java_distribution }}
      jar_subproject: ${{ inputs.jar_subproject }}
      docker_build_args: ${{ inputs.docker_build_args }}
      app_name: ${{ inputs.app_name }}
      image_tag: ${{ inputs.image_tag }}
      additional_image_tags: ${{ inputs.additional_image_tags }}
      dockerfile_requires_git: ${{ inputs.dockerfile_requires_git }}
    secrets: inherit

  helm_deploy:
    needs: build_and_push
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-deploy.yml@0cb7eb8ab4bf643986ab36ecf3ffcdffa9b55214 # SHA for main as of 3 JUN 2026
    with:
      environment: ${{ inputs.environment }}
      image_repo: ${{ needs.build_and_push.outputs.image_repo }}
      image_registry: ${{ needs.build_and_push.outputs.image_registry }}
      image_tag: ${{ needs.build_and_push.outputs.image_tag }}
      k8s_service_account: ${{ inputs.k8s_service_account }}
      helm_release_name: ${{ inputs.helm_release_name }}
      helm_chart: ${{ inputs.helm_chart }}
      helm_values_path: ${{ inputs.helm_values_path }}
      helm_additional_args: ${{ inputs.helm_additional_args }}
    secrets: inherit
