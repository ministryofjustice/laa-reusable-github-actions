name: CP - Build image, push to ECR, scan for vulns and deploy to Cloud Platform

permissions: {}

on:
  workflow_call:
    secrets:
      SNYK_CLIENT_ID:
        description: "Snyk Client ID of the Snyk Service Account"
        required: true
      SNYK_CLIENT_SECRET:
        description: "Snyk Client Secret of the Snyk Service Account"
        required: true
      ECR_ROLE_TO_ASSUME:
        description: "IAM role to assume for pushing images to ECR"
        required: true
      KUBE_CLUSTER:
        description: "Kubernetes cluster to deploy to"
        required: true
      KUBE_NAMESPACE:
        description: "Kubernetes namespace to deploy to"
        required: true
      KUBE_TOKEN:
        description: "Kubernetes authentication token"
        required: true
      KUBE_CERT:
        description: "Kubernetes cluster certificate"
        required: true
    inputs:
      ecr_repository:
        description: "Repository name for ECR (usually ${github-team}/${namespace} and found in your repository GitHub Variables)"
        required: true
        type: string
      environment:
        description: "Deployment Environment"
        required: false
        type: string
      dockerfile_path:
        description: "Path to build Dockerfile"
        required: false
        type: string
        default: Dockerfile #--Dockerfile in current working directory
      app_name:
        description: "App Name"
        required: true
        type: string
      image_tag:
        description: "Image Tag"
        required: false
        type: string
        default: ${{ github.sha }}
      dockerfile_requires_git:
        description: "Set to 'true' if the Dockerfile needs git access"
        required: false
        type: boolean
        default: false
      k8s_service_account:
        description: "Service Account for Kubernetes Authentication"
        required: false
        type: string
        default: cd-serviceaccount
      helm_release_name:
        description: "Release Name for helm install"
        required: true
        type: string
      helm_chart:
        description: "Helm chart to use for release"
        required: true
        type: string
        default: ./laa-generic-helm-chart
      helm_values_path:
        description: "Path to values for helm deployment"
        required: true
        type: string
      helm_additional_args:
        description: "Any additional helm arguments"
        required: false
        type: string

jobs:
  build_and_push:
    uses: ./.github/workflows/cp-build-push.yml
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    with:
      environment: ${{ inputs.environment }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
      app_name: ${{ inputs.app_name }}
      image_tag: ${{ inputs.image_tag }}
      dockerfile_requires_git: ${{ inputs.dockerfile_requires_git }}
      ecr_repository: ${{ inputs.ecr_repository }}
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}

  helm_deploy:
    needs: build_and_push
    uses: ./.github/workflows/cp-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      image_repo: ${{ needs.build_and_push.outputs.image_repo }}
      image_registry: ${{ needs.build_and_push.outputs.image_registry }}
      image_tag: ${{ needs.build_and_push.outputs.image_tag }}
      k8s_service_account: ${{ inputs.k8s_service_account }}
      helm_release_name: ${{ inputs.helm_release_name }}
      helm_chart: ${{ inputs.helm_chart }}
      helm_values_path: ${{ inputs.helm_values_path }}
      helm_additional_args: ${{ inputs.helm_additional_args }}
    secrets: inherit
