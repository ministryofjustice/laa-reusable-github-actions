name: Perform Static Application Security Testing
description: A reusable workflow to perform SaST on a given repo. See docs/README-sast.md for more info.

on:
  workflow_call:
    inputs:
      image_uri:
        description: "URI of image to scan. The workflow intentionally doesn't perform any image building."
        required: false
        type: string
      dockerfile_path:
        description: "Path to Dockerfile that will be used by Snyk to scan"
        required: false
        default: "Dockerfile"
        type: string
      iac_path:
        description: "Path to repo's helm deployment files. Leave unset to not run the checks"
        required: false
        default: ""
        type: string
      minimum_threshold:
        description: "The minimum threshold to report vulnerabilities. Must be one of low|medium|high|critical"
        required: false
        default: "high"
        type: string
      exclude_base_image_vulns:
        description: "Set true to pass --exclude-base-image-vulns to Snyk container scans"
        required: false
        default: false
        type: boolean
      ecr_session_name:
        description: "The name of the session to use in ECR. Used for auditing purposes, set to what makes sense."
        required: false
        default: "laa-reusable-snyk"
        type: string
    # These secrets MUST be set to authenticate
    # You can alternatively also pass a static token in to authenticate
    secrets:
      SNYK_TOKEN:
        required: false
      SNYK_CLIENT_ID:
        required: false
      SNYK_CLIENT_SECRET:
        required: false
      ECR_ROLE_TO_ASSUME:
        required: false

jobs:
  sast:
    name: Scan IaC & Container with Snyk
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets can't be used in if-checks so we have to define a global flag to verify
      - name: Check if we have tokens defined
        id: check-tokens
        env:
          INPUTS_IMAGE_URI: ${{ inputs.image_uri }}
        run: |
          echo "has_token=${{ secrets.SNYK_TOKEN != '' }}" >> $GITHUB_ENV
          echo "has_oauth=${{ secrets.SNYK_CLIENT_ID != '' && secrets.SNYK_CLIENT_SECRET != ''}}" >> $GITHUB_ENV
          echo "has_ecr_role=${{ secrets.ECR_ROLE_TO_ASSUME != '' }}" >> $GITHUB_ENV

          has_token="${{ secrets.SNYK_TOKEN != '' }}"
          has_oauth="${{ secrets.SNYK_CLIENT_ID != '' && secrets.SNYK_CLIENT_SECRET != ''}}"
          has_ecr_role="${{ secrets.ECR_ROLE_TO_ASSUME != '' }}"

          if [[ "$has_token" == 'false' && "$has_oauth" == 'false' ]]; then
            echo "::error::Either SNYK_TOKEN or both SNYK_CLIENT_ID and SNYK_CLIENT_SECRET must be set"
            exit 1
          fi

          if [[ "${INPUTS_IMAGE_URI}" != '' && "$has_ecr_role" == 'false' ]]; then
            echo "::error::image_uri was provided but no ECR role is configured. Set the ECR_ROLE_TO_ASSUME secret or pass the ecr_role input."
            exit 1
          fi

      # Early exit if there's no container setup to scan
      - name: Check Dockerfile exists
        id: check-dockerfile
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && inputs.image_uri != '' }}
        env:
          INPUTS_DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        run: |
          if [ ! -f "${INPUTS_DOCKERFILE_PATH}" ]; then
            echo "::error::Dockerfile not found at ${INPUTS_DOCKERFILE_PATH}, seems there isn't a container to scan"
            exit 1
          fi

      - name: Configure AWS credentials for ECR access
        id: ecr-auth
        if: ${{ !cancelled() && env.has_ecr_role == 'true' }}
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/ecr-auth@583a60502327d7b9b7701fdb11be9f7d096cf9f5 # SHA for main as of 12/06/2026
        with:
          ecr_role: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr_region: "eu-west-2"
          role-session-name: ${{ inputs.ecr_session_name }}

      - name: Obtain Short-lived token
        id: auth
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
        if: ${{ !cancelled() && env.has_token == 'false' && env.has_oauth == 'true' }}
        with:
          client_id: ${{ secrets.SNYK_CLIENT_ID }}
          client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

      - name: Install Snyk CLI
        id: install-snyk
        if: ${{ !cancelled() && (env.has_token == 'true' || steps.auth.outcome == 'success') }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      # snyk iac test can't parse raw Helm chart templates (they contain Go
      # templating syntax, not valid YAML). If iac_path looks like a Helm
      # chart (has a Chart.yaml), render it for every values*.yaml found
      # alongside it before scanning. Plain IaC paths (no Chart.yaml) are
      # scanned as-is, unchanged from previous behaviour.
      # This is Snyk's own documented approach for scanning Helm charts via
      # the CLI, see: https://docs.snyk.io/developer-tools/snyk-cli/scan-and-maintain-projects-using-the-cli/snyk-cli-for-iac/test-your-iac-files/helm-charts
      - name: Set up Helm
        id: setup-helm
        if: ${{ !cancelled() && inputs.iac_path != '' && hashFiles(format('{0}/Chart.yaml', inputs.iac_path)) != '' }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Render Helm charts for IaC scanning
        id: render-iac
        if: ${{ !cancelled() && inputs.iac_path != '' && steps.setup-helm.outcome != 'failure' }}
        env:
          INPUTS_IAC_PATH: ${{ inputs.iac_path }}
        run: |
          if [ -f "${INPUTS_IAC_PATH}/Chart.yaml" ]; then
            # Render under the checkout (not RUNNER_TEMP) so Snyk's SARIF
            # artifactLocation.uri values stay repository-relative; an
            # out-of-repo path can't be mapped by GitHub code scanning and
            # may be rejected on upload. This is safe even when iac_path is
            # "." (the repo root): we only ever write templated output here,
            # never copy the chart source into itself.
            RENDERED_IAC_DIR="${GITHUB_WORKSPACE}/rendered-iac"
            rm -rf "${RENDERED_IAC_DIR}"
            mkdir -p "${RENDERED_IAC_DIR}"

            shopt -s nullglob
            values_files=("${INPUTS_IAC_PATH}"/values*.yaml)
            shopt -u nullglob

            if [ ${#values_files[@]} -eq 0 ]; then
              echo "No values*.yaml files found alongside Chart.yaml at ${INPUTS_IAC_PATH}, rendering with chart defaults"
              if ! helm template "${INPUTS_IAC_PATH}" > "${RENDERED_IAC_DIR}/default.yaml"; then
                echo "::error::Failed to render Helm chart using its default values"
                rm -f "${RENDERED_IAC_DIR}/default.yaml"
                exit 1
              fi
            else
              for values_file in "${values_files[@]}"; do
                env_name="$(basename "${values_file}" .yaml)"
                if ! helm template "${INPUTS_IAC_PATH}" -f "${values_file}" > "${RENDERED_IAC_DIR}/${env_name}.yaml"; then
                  echo "::error::Failed to render Helm chart using ${values_file}"
                  rm -f "${RENDERED_IAC_DIR}/${env_name}.yaml"
                  exit 1
                fi
              done
            fi

            echo "rendered_iac_dir=${RENDERED_IAC_DIR}" >> "$GITHUB_OUTPUT"
          else
            # Plain (non-Helm) IaC inputs are scanned as-is, unchanged from
            # previous behaviour. Scan the original path directly rather than
            # a copy, so Snyk's SARIF output keeps file locations relative to
            # the checkout and GitHub can match alerts back to committed files.
            echo "No Chart.yaml found at ${INPUTS_IAC_PATH}, scanning original path as-is"
            echo "rendered_iac_dir=${INPUTS_IAC_PATH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan dependencies using container runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.check-tokens.outcome == 'success' && steps.check-dockerfile.outcome == 'success' && steps.ecr-auth.outcome == 'success' && steps.install-snyk.outcome == 'success' && inputs.image_uri != '' }}
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          MINIMUM_THRESHOLD: ${{ inputs.minimum_threshold }}
          INPUTS_IMAGE_URI: ${{ inputs.image_uri }}
          INPUTS_DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          INPUTS_EXCLUDE_BASE_IMAGE_VULNS: ${{ inputs.exclude_base_image_vulns }}
        run: |
          case "${INPUTS_EXCLUDE_BASE_IMAGE_VULNS}" in
            true|false) ;;
            *)
              echo "::error::exclude_base_image_vulns must be true or false"
              exit 1
              ;;
          esac

          POLICY_ARGS=()

          if [ -f ".snyk" ]; then
            POLICY_ARGS+=(--policy-path=".snyk")
          fi

          mkdir -p sarif
          if [ "${INPUTS_EXCLUDE_BASE_IMAGE_VULNS}" = "true" ]; then
            snyk container test "${INPUTS_IMAGE_URI}" \
              --severity-threshold="${MINIMUM_THRESHOLD}" \
              --sarif-file-output="sarif/snyk.sarif" \
              --file="${INPUTS_DOCKERFILE_PATH}" \
              "${POLICY_ARGS[@]}" \
              --exclude-base-image-vulns
          else
            snyk container test "${INPUTS_IMAGE_URI}" \
              --severity-threshold="${MINIMUM_THRESHOLD}" \
              --sarif-file-output="sarif/snyk.sarif" \
              --file="${INPUTS_DOCKERFILE_PATH}" \
              "${POLICY_ARGS[@]}"
          fi

      - name: Monitor current dependencies
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.check-tokens.outcome == 'success' && steps.check-dockerfile.outcome == 'success' && steps.ecr-auth.outcome == 'success' && steps.install-snyk.outcome == 'success' && inputs.image_uri != '' }}
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          INPUTS_IMAGE_URI: ${{ inputs.image_uri }}
          INPUTS_DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        run: |
          POLICY_ARGS=()

          if [ -f ".snyk" ]; then
            POLICY_ARGS+=(--policy-path=".snyk")
          fi

          snyk container monitor ${INPUTS_IMAGE_URI} \
            --file=${INPUTS_DOCKERFILE_PATH} \
            "${POLICY_ARGS[@]}"

      - name: Scan Infrastructure as Code files
        if: ${{ !cancelled() && steps.install-snyk.outcome == 'success' && steps.render-iac.outcome == 'success' && inputs.iac_path != '' }}
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          MINIMUM_THRESHOLD: ${{ inputs.minimum_threshold }}
          RENDERED_IAC_DIR: ${{ steps.render-iac.outputs.rendered_iac_dir }}
        run: |
          mkdir -p sarif
          snyk iac test "${RENDERED_IAC_DIR}" \
            --severity-threshold=${MINIMUM_THRESHOLD} \
            --sarif-file-output=sarif/snyk-iac.sarif

      - name: Scan codebase
        if: ${{ !cancelled() && steps.install-snyk.outcome == 'success' }}
        env:
          SNYK_OAUTH_TOKEN: ${{ steps.auth.outputs.token }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          MINIMUM_THRESHOLD: ${{ inputs.minimum_threshold }}
        run: |
          snyk code test \
            --severity-threshold=${MINIMUM_THRESHOLD} \
            --sarif-file-output=sarif/snyk-code.sarif

      - name: Sanitise SARIF files
        if: always()
        run: |
          for sarif in sarif/*.sarif; do
            if [ -f "$sarif" ]; then
              sed -i 's/"security-severity": "null"/"security-severity": "0"/g' "$sarif"
              sed -i 's/"security-severity": "undefined"/"security-severity": "0"/g' "$sarif"
            fi
          done

      - name: Upload SARIF files
        if: always() && hashFiles('sarif/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: "sarif"
