name: MP - Build image, push to ECR and scan for vulns

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment Environment"
        required: false
        type: string
      dockerfile_path:
        description: "Path to build Dockerfile"
        required: false
        type: string
        default: Dockerfile #--Dockerfile in current working directory
      app_name:
        description: "App Name"
        required: true
        type: string
      image_repo:
        description: "ECR Repo Name"
        required: true
        type: string
      image_tag:
        description: "Image Tag"
        required: false
        type: string
        default: ${{ github.sha }}
      image_scan_critical_high_exit_code:
        description: "Error code for image scanner critical/high vulns" #--Set to 0 to allow soft failures
        type: number
        default: 1
    outputs:
      image_registry:
        description: "Image Registry"
        value: ${{ jobs.build_push.outputs.image_registry }}
      image_repo:
        description: "Image Registry"
        value: ${{ jobs.build_push.outputs.image_repo }}
      image_tag:
        description: "Image Registry"
        value: ${{ jobs.build_push.outputs.image_tag }}
      image_uri:
        description: "Image Registry"
        value: ${{ jobs.build_push.outputs.image_uri }}
    secrets:
      SNYK_CLIENT_ID:
        required: true
      SNYK_CLIENT_SECRET:
        required: true

jobs:
  build_push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment }}

    steps:
    - name: Git Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #--v7.0.1

    #--Prereq steps https://user-guide.modernisation-platform.service.justice.gov.uk/user-guide/deploying-your-application.html#using-oidc-in-your-application-deployment-pipeline
    - name: ECR Auth
      id: auth
      uses: $/.github/actions/ecr-auth
      with:
        ecr_region: ${{ vars.AWS_REGION }}
        ecr_role: arn:aws:iam::${{ secrets.DEPLOYMENT_ACCOUNT_ID }}:role/modernisation-platform-oidc-cicd
        role-session-name: "github-cicd-${{ inputs.app_name }}-${{ github.run_number }}"
        account_ids: ${{ secrets.ECR_ACCOUNT_ID }}

    - name: Build and Push
      id: build
      uses: $/.github/actions/build-and-push
      with:
        dockerfile_path: ${{ inputs.dockerfile_path }}
        image_registry: ${{ steps.auth.outputs.image_registry }}
        image_repo: ${{ inputs.image_repo }}
        image_tag: ${{ inputs.image_tag }}

    - name: ECR Auth to CP
      id: authcp
      uses: $/.github/actions/ecr-auth
      with:
        ecr_region: ${{ vars.AWS_REGION }}
        ecr_role: ${{ secrets.ECR_ROLE_TO_ASSUME }}
        role-session-name: "github-cicd-${{ inputs.app_name }}-${{ github.run_number }}"
        account_ids: ${{ secrets.CP_ECR_ACCOUNT_ID }}

    - name: Publish image into CP ECR
      id: publish-image to CP
      if: ${{ inputs.app_name == 'ccms-oia' }}
      run: |
        docker tag ${{ steps.build.outputs.image_registry }}/${{ steps.build.outputs.image_repo }}:${{ steps.build.outputs.image_tag }} ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ format('{0}-{1}', vars.IMAGE_PREFIX, github.sha) }}
        docker push  ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:${{ format('{0}-{1}', vars.IMAGE_PREFIX, github.sha) }}
        echo "published_image_version=${{ format('{0}-{1}', vars.IMAGE_PREFIX, github.sha) }}" >> $GITHUB_OUTPUT
      shell: bash
      env:
        GIT_TOKEN: ${{ github.token }}

    - name: Output
      id: output
      run: |
        echo image_registry=${{ steps.build.outputs.image_registry }} >> "$GITHUB_OUTPUT"
        echo image_repo=${{ steps.build.outputs.image_repo }} >> "$GITHUB_OUTPUT"
        echo image_tag=${{ steps.build.outputs.image_tag }} >> "$GITHUB_OUTPUT"
        echo image_uri="${{ steps.build.outputs.image_registry }}/${{ steps.build.outputs.image_repo }}:${{ steps.build.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

    outputs:
      image_registry: ${{ steps.output.outputs.image_registry }}
      image_repo: ${{ steps.output.outputs.image_repo }}
      image_tag: ${{ steps.output.outputs.image_tag }}
      image_uri: ${{ steps.output.outputs.image_uri }}
        
